[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-rednote"
version = "0.2.0"
description = "A CLI-Anything RedNote CLI for publishing, discovery, interactions, notifications and drafts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["click>=8.1,<9", "httpx>=0.27,<1", "prompt-toolkit>=3.0,<4"]

[project.urls]
Homepage = "https://github.com/JACKWang19559/RedNote-cli"
Repository = "https://github.com/JACKWang19559/RedNote-cli"
Issues = "https://github.com/JACKWang19559/RedNote-cli/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1.2,<2", "ruff>=0.8,<1"]

[project.scripts]
rednote = "cli_anything.rednote.rednote_cli:main"
cli-anything-rednote = "cli_anything.rednote.rednote_cli:main"

[tool.setuptools.packages.find]
include = ["cli_anything.rednote*"]
namespaces = true

[tool.setuptools.package-data]
"cli_anything.rednote" = ["skills/*.md", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
extend-exclude = ["cli_anything/rednote/utils/repl_skin.py"]
